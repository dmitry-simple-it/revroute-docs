# Демо встроенного кабинета партнёра RevRoute на simple-it.pro/demo/revroute-cabinet/.
# Подключается в server-блок simple-it.pro строкой
#   include /etc/nginx/snippets/revroute-cabinet-demo.conf;
# Ключ API демо-пространства cloudflow-demo (права «Ссылки: запись») лежит отдельно,
# в /etc/nginx/revroute-cabinet-demo-key.conf (600, root), строкой
#   proxy_set_header Authorization "Bearer rr_…";
# Лимит запросов — зона rrcabinet в /etc/nginx/conf.d/revroute-cabinet-demo-limit.conf.

location = /demo/revroute-cabinet {
    return 301 /demo/revroute-cabinet/;
}

# Выдача публичного токена встроенного кабинета для демо-партнёра «ТехноБлог».
# На сайте вендора этот запрос делает его сервер для вошедшего пользователя.
location = /demo/revroute-cabinet/token {
    limit_except GET { deny all; }
    limit_req zone=rrcabinet burst=10 nodelay;
    include /etc/nginx/revroute-cabinet-demo-key.conf;
    proxy_pass_request_headers off;
    proxy_method POST;
    proxy_set_header Content-Type "application/json";
    proxy_set_body '{"partnerId":"pn_DEMO_TECHNOBLOG_000000000"}';
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;
    proxy_pass https://app.revroute.ru/api/tokens/embed/referrals;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location /demo/revroute-cabinet/ {
    alias /var/www/revroute-cabinet-demo/;
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
