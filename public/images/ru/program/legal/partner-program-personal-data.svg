<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc">
<title id="title">Потоки персональных данных в партнёрской программе</title>
<desc id="desc">Два пути данных клиента: самостоятельная заявка компании или передача контакта партнёром при законном основании. Отдельно показаны данные самого партнёра, роли компании и RevRoute, расчётные получатели. Акцепт, необходимое согласие на данные и согласие на рекламу фиксируются раздельно.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#167052" stroke-width="1.6"/></marker><style>text{font-family:Arial,sans-serif;fill:#172e25}.title{font-size:40px;font-weight:700}.heading{font-size:28px;font-weight:700}.body{font-size:25px}.small{font-size:23px;fill:#52645c}.flow{fill:none;stroke:#167052;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="1300" fill="white"/>
<text x="64" y="69" class="title">Как данные проходят через партнёрскую программу</text>
<text x="64" y="110" class="small">Для каждой цели определяются роли, необходимый набор данных и правовое основание.</text>
<text x="64" y="174" class="heading">А  Клиент обращается в компанию сам</text>
<rect x="64" y="204" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="82" y="245" class="heading">Партнёр</text>
<text x="82" y="286" class="body">Передаёт ссылку</text>
<text x="82" y="317" class="body">Без клиентской базы</text>
<rect x="448" y="204" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="466" y="245" class="heading">Клиент</text>
<text x="466" y="286" class="body">Заполняет форму</text>
<text x="466" y="317" class="body">Видит документы</text>
<rect x="832" y="204" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="850" y="245" class="heading">Компания</text>
<text x="850" y="286" class="body">Оператор данных</text>
<text x="850" y="317" class="body">Заявка и CRM</text>
<rect x="1216" y="204" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="1234" y="245" class="heading">RevRoute</text>
<text x="1234" y="286" class="body">Учёт по поручению</text>
<text x="1234" y="317" class="body">Минимум для расчёта</text>
<path d="M391 288 H441" class="flow"/>
<text x="64" y="409" class="small">Ссылка клиенту</text>
<path d="M775 288 H825" class="flow"/>
<text x="448" y="409" class="small">Основание и нужные согласия</text>
<path d="M1159 288 H1209" class="flow"/>
<text x="832" y="409" class="small">Поручение и правила доступа</text>
<text x="64" y="464" class="heading">Б  Партнёр передаёт контакт клиента</text>
<rect x="64" y="494" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="82" y="535" class="heading">Клиент</text>
<text x="82" y="576" class="body">Проверяется основание</text>
<text x="82" y="607" class="body">для выбранной передачи</text>
<rect x="448" y="494" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="466" y="535" class="heading">Партнёр</text>
<text x="466" y="576" class="body">Собирает минимум</text>
<text x="466" y="607" class="body">Сохраняет подтверждение</text>
<rect x="832" y="494" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="850" y="535" class="heading">Компания</text>
<text x="850" y="576" class="body">Проверяет передачу</text>
<text x="850" y="607" class="body">Информирует по закону</text>
<rect x="1216" y="494" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="1234" y="535" class="heading">RevRoute</text>
<text x="1234" y="576" class="body">Необходимые события</text>
<text x="1234" y="607" class="body">По поручению компании</text>
<path d="M391 578 H441" class="flow"/>
<text x="64" y="699" class="small">Цель и круг получателей</text>
<path d="M775 578 H825" class="flow"/>
<text x="448" y="699" class="small">Только согласованный набор</text>
<path d="M1159 578 H1209" class="flow"/>
<text x="832" y="699" class="small">Без лишних контактов партнёру</text>
<text x="64" y="758" class="heading">Отдельный поток  Данные самого партнёра</text>
<rect x="64" y="792" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="82" y="833" class="heading">Партнёр</text>
<text x="82" y="874" class="body">Анкета и статус</text>
<text x="82" y="905" class="body">Реквизиты для выплаты</text>
<rect x="448" y="792" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="466" y="833" class="heading">Компания</text>
<text x="466" y="874" class="body">Договор программы</text>
<text x="466" y="905" class="body">Документы об услугах</text>
<rect x="832" y="792" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="850" y="833" class="heading">RevRoute</text>
<text x="850" y="874" class="body">Аккаунт и расчёты</text>
<text x="850" y="905" class="body">Свои цели отдельно</text>
<rect x="1216" y="792" width="322" height="168" rx="16" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
<text x="1234" y="833" class="heading">Банк или провайдер</text>
<text x="1234" y="874" class="body">Платёж и проверки</text>
<text x="1234" y="905" class="body">Роль по своему договору</text>
<path d="M391 876 H441" class="flow"/>
<path d="M775 876 H825" class="flow"/>
<path d="M1159 876 H1209" class="flow"/>
<path d="M225 960 V982 H995 V960" class="flow" stroke-dasharray="7 6"/>
<text x="395" y="1018" class="small">Аккаунт партнёра создаётся напрямую в RevRoute</text>
<rect x="64" y="1050" width="1472" height="186" rx="18" fill="#edf6ef" stroke="#b7d1c0" stroke-width="2"/>
<text x="90" y="1093" class="heading">Три самостоятельных подтверждения</text>
<text x="90" y="1136" class="body">Акцепт оферты     •     Согласие на ПДн, когда нужно     •     Необязательная реклама</text>
<text x="90" y="1176" class="small">Сохраняются текст, редакция и действие. Без предварительных отметок.</text>
<text x="90" y="1208" class="small">Принятие условий партнёром не является согласием клиента или посетителя сайта.</text>
</svg>