<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">От события до выплаты партнёру</title>
  <desc id="desc">Согласованное событие проходит проверку, подтверждение, включение в расчётный реестр и процедуру приёмки, затем производится выплата. Чек плательщика НПД оформляется при расчёте в применимый законный срок и не является условием, требующим заранее оформить чек на ещё не полученные деньги. Возврат клиента запускает проверку основания и корректировку расчёта с уведомлением партнёра и правом возразить.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#167052" stroke-width="1.6"/></marker>
    <marker id="return-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#67776a" stroke-width="1.6"/></marker>
    <style>
      text { font-family: Arial, 'Segoe UI', sans-serif; fill: #172e25; }
      .title { font-size: 40px; font-weight: 700; }
      .sub { font-size: 24px; fill: #52645c; }
      .heading { font-size: 27px; font-weight: 700; }
      .body { font-size: 24px; }
      .label { font-size: 23px; fill: #455b50; }
      .node { fill: #f7faf8; stroke: #bccfc2; stroke-width: 2; }
      .flow { fill: none; stroke: #167052; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #67776a; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#return-arrow); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="64" y="69" class="title">Как результат партнёра становится выплатой</text>
  <text x="64" y="111" class="sub">Для каждой стадии заранее определите основание, ответственного, срок и подтверждающий документ.</text>

  <rect x="60" y="205" width="250" height="217" rx="18" class="node"/>
  <rect x="360" y="205" width="250" height="217" rx="18" class="node"/>
  <rect x="660" y="205" width="250" height="217" rx="18" class="node"/>
  <rect x="960" y="205" width="280" height="217" rx="18" class="node"/>
  <rect x="1290" y="205" width="250" height="217" rx="18" fill="#e8f4ec" stroke="#94bba4" stroke-width="2"/>

  <text x="85" y="244" class="label">01</text>
  <text x="185" y="293" text-anchor="middle" class="heading">Событие</text>
  <text x="185" y="334" text-anchor="middle" class="label">RevRoute учитывает</text>
  <text x="185" y="366" text-anchor="middle" class="label">событие из условий</text>
  <text x="185" y="398" text-anchor="middle" class="label">программы.</text>
  <text x="385" y="244" class="label">02</text>
  <text x="485" y="293" text-anchor="middle" class="heading">Проверка</text>
  <text x="485" y="334" text-anchor="middle" class="label">Проверены связь</text>
  <text x="485" y="366" text-anchor="middle" class="label">с партнёром</text>
  <text x="485" y="398" text-anchor="middle" class="label">и критерии события.</text>
  <text x="685" y="244" class="label">03</text>
  <text x="785" y="293" text-anchor="middle" class="heading">Подтверждено</text>
  <text x="785" y="334" text-anchor="middle" class="label">Рассчитаны V, A, N</text>
  <text x="785" y="366" text-anchor="middle" class="label">по согласованным</text>
  <text x="785" y="398" text-anchor="middle" class="label">условиям.</text>
  <text x="985" y="244" class="label">04</text>
  <text x="1100" y="284" text-anchor="middle" class="heading">Реестр и приёмка</text>
  <text x="1100" y="334" text-anchor="middle" class="label">Расчёт, первичный</text>
  <text x="1100" y="366" text-anchor="middle" class="label">документ, возражения</text>
  <text x="1100" y="398" text-anchor="middle" class="label">и их рассмотрение.</text>
  <text x="1315" y="244" class="label">05</text>
  <text x="1415" y="293" text-anchor="middle" class="heading">Выплата</text>
  <text x="1415" y="344" text-anchor="middle" class="label">Нетто-сумма N</text>
  <text x="1415" y="376" text-anchor="middle" class="label">через RevRoute.</text>
  <path d="M310 311 H359" class="flow"/>
  <path d="M610 311 H659" class="flow"/>
  <path d="M910 311 H959" class="flow"/>
  <path d="M1240 311 H1289" class="flow"/>

  <path d="M1415 422 V490" class="flow"/>
  <rect x="960" y="493" width="580" height="187" rx="18" fill="#edf6ef" stroke="#b7d1c0" stroke-width="2"/>
  <text x="995" y="540" class="heading">Чек НПД — при расчёте</text>
  <text x="995" y="586" class="body">На полученную сумму, в адрес заказчика.</text>
  <text x="995" y="625" class="label">Передать и проверить в применимый</text>
  <text x="995" y="656" class="label">законный срок; учесть выбранный маршрут.</text>

  <rect x="60" y="537" width="390" height="122" rx="18" fill="#f8f9f5" stroke="#cad0c3" stroke-width="2"/>
  <text x="255" y="584" text-anchor="middle" class="heading">Возврат клиенту</text>
  <text x="255" y="624" text-anchor="middle" class="label">в том числе после выплаты</text>
  <path d="M255 659 V724" class="return"/>
  <rect x="60" y="727" width="1480" height="164" rx="18" fill="#f8f9f5" stroke="#cad0c3" stroke-width="2"/>
  <text x="95" y="773" class="heading">Отдельная корректировка по согласованному правилу</text>
  <text x="95" y="818" class="body">Проверить основание и сумму → уведомить партнёра → рассмотреть возражения → уточнить расчёт.</text>
  <text x="95" y="861" class="label">Если деньги уже выплачены, применяется согласованный порядок зачёта или возврата; история сохраняется.</text>
  <path d="M790 727 V490 H485 V423" class="return"/>
  <text x="65" y="959" class="label">Компания подтверждает результат и финансирует бюджет; RevRoute организует расчёты по агентскому договору.</text>
</svg>
