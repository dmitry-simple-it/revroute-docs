<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Как условия в сервисе становятся частью договора</title>
  <desc id="desc">Постоянный юридический текст и согласованные параметры программы в RevRoute образуют полный набор условий. Участник получает доступ к нему до заключения договора. Компания обеспечивает сохранение принятой редакции и доказательства акцепта. Архив отражает прошлое и не редактируется; новое значение в сервисе проходит предусмотренную процедуру изменения. Автоматический снимок не предполагается.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#167052" stroke-width="1.6"/></marker>
    <style>
      text { font-family: Arial, 'Segoe UI', sans-serif; fill: #172e25; }
      .title { font-size: 40px; font-weight: 700; }
      .sub { font-size: 24px; fill: #52645c; }
      .heading { font-size: 29px; font-weight: 700; }
      .body { font-size: 25px; }
      .label { font-size: 23px; fill: #455b50; }
      .flow { fill: none; stroke: #167052; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1060" fill="#ffffff"/>
  <text x="64" y="69" class="title">Один договор: постоянные правила + параметры программы</text>
  <text x="64" y="109" class="sub">Согласованные значения живут в сервисе. Архив позволяет восстановить принятые условия.</text>

  <rect x="64" y="162" width="670" height="298" rx="22" fill="#f7faf8" stroke="#cbdad0" stroke-width="2"/>
  <rect x="866" y="162" width="670" height="298" rx="22" fill="#edf6ef" stroke="#b7d1c0" stroke-width="2"/>
  <text x="99" y="210" class="heading">Текст договора</text>
  <text x="99" y="257" class="body">• Стороны и содержание услуг</text>
  <text x="99" y="303" class="body">• Присоединение, расчёты и документы</text>
  <text x="99" y="349" class="body">• Изменения, прекращение и споры</text>
  <text x="99" y="407" class="label">Определяет правила и способ включения</text>
  <text x="99" y="438" class="label">параметров программы в договор.</text>

  <text x="901" y="210" class="heading">Параметры в RevRoute</text>
  <text x="901" y="257" class="body">• События, ставки и база расчёта</text>
  <text x="901" y="303" class="body">• Сроки, пороги и атрибуция</text>
  <text x="901" y="349" class="body">• Группы, комиссия и нетто-сумма</text>
  <text x="901" y="407" class="label">Показывают применимые значения.</text>
  <text x="901" y="438" class="label">Скрытая настройка ≠ согласованное условие.</text>
  <text x="800" y="321" text-anchor="middle" font-size="64" fill="#167052">+</text>

  <path d="M400 460 V505 H800 V535" class="flow"/>
  <path d="M1200 460 V505 H800" fill="none" stroke="#167052" stroke-width="3"/>
  <rect x="260" y="538" width="1080" height="109" rx="18" fill="#ffffff" stroke="#94bba4" stroke-width="2"/>
  <text x="800" y="581" text-anchor="middle" class="heading">Полный набор доступен участнику до заключения договора</text>
  <text x="800" y="621" text-anchor="middle" class="label">Отправка формы с согласием — акцепт; одобрение — допуск к оплачиваемым услугам.</text>

  <path d="M800 647 V702" class="flow"/>
  <rect x="160" y="704" width="1280" height="186" rx="20" fill="#e8f4ec" stroke="#94bba4" stroke-width="2"/>
  <text x="800" y="754" text-anchor="middle" class="heading">Принятая редакция + доказательство акцепта</text>
  <text x="800" y="802" text-anchor="middle" class="body">Юридический текст · параметры · участник · программа · дата · действие</text>
  <text x="800" y="853" text-anchor="middle" class="label">Сохранённая копия фиксирует прошлое и не заменяет управление параметрами в сервисе.</text>

  <text x="800" y="950" text-anchor="middle" class="body" font-weight="700">Сохранение обеспечивает компания: доступной функцией либо согласованным ручным процессом.</text>
  <text x="800" y="993" text-anchor="middle" class="label">Изменение условий → новая редакция и необходимое уведомление или согласие; прежний архив сохраняется.</text>
</svg>
